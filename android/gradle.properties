# Память для компиляции
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# KSP пока не полностью совместим с configuration cache — держим выключенным
#org.gradle.configuration-cache=true

# Адрес backend (по умолчанию — прод студ-подряд.рф, см. app/build.gradle.kts).
# Для запуска против локального сервера с эмулятора раскомментируйте:
#API_BASE_URL=http://10.0.2.2:3000

# Не тащим транзитивные зависимости из неожиданных мест
android.nonTransitiveRClass=true

# KSP
ksp.useKSP2=false
